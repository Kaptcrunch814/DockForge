services:
  dockforge:
    container_name: dockforge
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Docker__UseFakeData=false
    restart: unless-stopped